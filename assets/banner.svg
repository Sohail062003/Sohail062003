<svg width="100%" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0221"/>
      <stop offset="45%" stop-color="#1a1245"/>
      <stop offset="100%" stop-color="#0f0c29"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#8A63F7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8A63F7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#glow)"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="90" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="30" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="70" r="1.3"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="20" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="180" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="210" r="1.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.0s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="35" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="80" r="1.3"><animate attributeName="opacity" values="1;0.3;1" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="25" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="60" r="1.8"><animate attributeName="opacity" values="1;0.2;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="120" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="190" r="1.6"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="220" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="15" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="230" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- shooting star -->
  <g>
    <line x1="0" y1="0" x2="60" y2="0" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9">
      <animateMotion path="M -60,50 L 1300,220" dur="4s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- title -->
  <text x="600" y="118" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="46" font-weight="700" fill="#ffffff">
    Hi, I'm Sohail Shaikh
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>

  <!-- subtitle -->
  <text x="600" y="160" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="19" fill="#c9b8ff">
    Full Stack Developer · MERN · Java &amp; Spring Boot
    <animate attributeName="opacity" values="0;0;1" dur="2.4s" fill="freeze"/>
  </text>

  <!-- bottom wave -->
  <path d="M0,260 L0,220 Q300,180 600,220 T1200,220 L1200,260 Z" fill="#0d0221" opacity="0.6"/>
</svg>
